name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npx vite@8 build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/android/app/muscu-release.keystore"
          echo "Keystore size: $(wc -c < $GITHUB_WORKSPACE/android/app/muscu-release.keystore) bytes"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/muscu-release.keystore" \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/muscu-plan-v${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Muscu Plan v${{ github.run_number }}"
          body: "Build automatique du ${{ github.event.head_commit.timestamp }}"
          files: android/app/build/outputs/apk/release/muscu-plan-v${{ github.run_number }}.apk
          make_latest: true

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: muscu-plan-v${{ github.run_number }}
          path: android/app/build/outputs/apk/release/muscu-plan-v${{ github.run_number }}.apk
          retention-days: 30
